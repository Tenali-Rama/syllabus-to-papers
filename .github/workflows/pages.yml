name: pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Build HTML site
        run: |
          mkdir -p site
          cat > site/style.css <<'CSS'
          body{font-family:Georgia,serif;max-width:820px;margin:2rem auto;padding:0 1rem;line-height:1.6;color:#1a1a1a}
          h1{border-bottom:2px solid #333} h2{border-bottom:1px solid #ccc;margin-top:2rem}
          table{border-collapse:collapse;margin:1rem 0} th,td{border:1px solid #999;padding:6px 12px}
          details{margin:0.5rem 0} summary{cursor:pointer;font-weight:bold}
          code{background:#f2f2f2;padding:1px 4px;border-radius:3px}
          CSS
          cat > site/header.html <<'H'
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
          <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
          <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
            onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});"></script>
          <div style="background:#eef;padding:8px 12px;border-radius:6px"><b><a href="../index.html">← All papers</a></b></div>
          H
          find papers -name "*.md" ! -name "qa_report.md" ! -name "blueprint.md" | while read f; do
            out="site/${f#papers/}"
            mkdir -p "$(dirname "$out")"
            out="${out%.md}.html"
            pandoc "$f" -f gfm -t html --mathjax -c style.css -H site/header.html -s -o "$out" --metadata title="$(basename "$out" .html)"
          done
          cp papers/*/run-*/PAPER-INDEX.md site/ 2>/dev/null || true
          {
            echo '<html><head><title>syllabus-to-papers</title><link rel="stylesheet" href="style.css"></head><body>'
            echo '<h1>📚 Papers</h1><ul>'
            find site -name "*.html" ! -name index.html | sort | while read f; do
              p="${f#site/}"; echo "<li><a href='$p'>$p</a></li>"
            done
            echo '</ul></body></html>'
          } > site/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

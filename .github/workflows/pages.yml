name: pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Build HTML site
        run: |
          mkdir -p site
          # ---------- CSS (light + dark, system-aware, toggle-able) ----------
          cat > site/style.css <<'CSS'
          :root{
            --bg:#f8f7f4; --fg:#1f2933; --muted:#64707d; --border:#d5d9dd;
            --accent:#0a66d0; --card:#ffffff; --code-bg:#eef0f2;
            --table-head:#eef0f2; --shadow:0 1px 3px rgba(0,0,0,.08);
          }
          body.dark{
            --bg:#14161a; --fg:#e4e7eb; --muted:#98a2ab; --border:#39414a;
            --accent:#7ab8ff; --card:#1b1f26; --code-bg:#22262d;
            --table-head:#1b1f26; --shadow:0 1px 4px rgba(0,0,0,.5);
          }
          *{box-sizing:border-box}
          html{scroll-behavior:smooth}
          body{
            font-family:"Source Serif Pro",Georgia,"Times New Roman",serif;
            font-size:1.05rem; line-height:1.75; color:var(--fg); background:var(--bg);
            max-width:760px; margin:0 auto; padding:0 1.1rem 4rem;
            transition:background .25s,color .25s;
          }
          .topbar{
            display:flex; justify-content:space-between; align-items:center;
            padding:.9rem 0; border-bottom:1px solid var(--border); margin-bottom:2rem;
            position:sticky; top:0; background:var(--bg); z-index:10;
          }
          .topbar a{color:var(--accent); text-decoration:none; font-weight:700; font-size:.95rem}
          #themeBtn{
            background:var(--card); color:var(--fg); border:1px solid var(--border);
            border-radius:8px; padding:.45rem .9rem; cursor:pointer; font-size:.9rem;
            box-shadow:var(--shadow);
          }
          #themeBtn:hover{border-color:var(--accent)}
          h1{font-size:1.7rem; line-height:1.3; margin:1.2rem 0 .6rem}
          h2{font-size:1.3rem; margin:2.4rem 0 .8rem; padding-bottom:.3rem; border-bottom:2px solid var(--border)}
          h3{font-size:1.1rem; margin:1.6rem 0 .5rem}
          p{margin:.7rem 0}
          hr{border:none; border-top:1px solid var(--border); margin:2.2rem 0}
          strong{font-weight:700}
          table{
            border-collapse:collapse; margin:1.2rem 0; width:100%;
            font-size:.95rem; box-shadow:var(--shadow); border-radius:6px; overflow:hidden;
          }
          th,td{border:1px solid var(--border); padding:.5rem .8rem; text-align:left; vertical-align:top}
          th{background:var(--table-head); font-family:sans-serif; font-size:.9rem}
          details{
            margin:.7rem 0; border:1px solid var(--border); border-radius:8px;
            padding:.6rem .9rem; background:var(--card);
          }
          summary{cursor:pointer; font-weight:700; color:var(--accent)}
          code{background:var(--code-bg); padding:.1rem .35rem; border-radius:4px;
               font-family:"SF Mono",Consolas,monospace; font-size:.88em}
          pre{background:var(--code-bg); padding:.8rem 1rem; border-radius:8px; overflow-x:auto}
          pre code{background:none; padding:0}
          ul{padding-left:1.3rem} li{margin:.25rem 0}
          .katex{font-size:1.03em}
          .katex-display{margin:.9rem 0; overflow-x:auto; overflow-y:hidden; padding:.2rem 0}
          @media print{.topbar{display:none} body{max-width:none}}
          CSS
          # ---------- head resources (KaTeX) ----------
          cat > site/head.html <<'H'
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
          <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
          <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
            onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true},{left:'$',right:'$',display:false}],throwOnError:false});"></script>
          <script>
          (function(){
            var saved = localStorage.getItem('theme');
            if(saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)){
              document.addEventListener('DOMContentLoaded', function(){
                document.body.classList.add('dark'); syncBtn();
              });
            }
          })();
          function toggleTheme(){
            var d = document.body.classList.toggle('dark');
            localStorage.setItem('theme', d ? 'dark' : 'light'); syncBtn();
          }
          function syncBtn(){
            var b = document.getElementById('themeBtn');
            if(b) b.textContent = document.body.classList.contains('dark') ? '☀️ Light' : '🌙 Dark';
          }
          document.addEventListener('DOMContentLoaded', syncBtn);
          </script>
          H
          # ---------- body topbar (injected into BODY, not head) ----------
          cat > site/topbar.html <<'B'
          <div class="topbar">
            <a href="../index.html">← All papers</a>
            <button id="themeBtn" onclick="toggleTheme()">🌙 Dark</button>
          </div>
          B
          # index topbar links up one level less
          cat > site/topbar-index.html <<'B'
          <div class="topbar">
            <span></span>
            <button id="themeBtn" onclick="toggleTheme()">🌙 Dark</button>
          </div>
          B
          # ---------- convert papers ----------
          find papers -name "*.md" ! -name "qa_report.md" ! -name "blueprint.md" | while read f; do
            out="site/${f#papers/}"
            mkdir -p "$(dirname "$out")"
            out="${out%.md}.html"
            pandoc "$f" -f gfm+tex_math_dollars -t html5 --mathjax \
              --metadata title="$(basename "${f%.md}")" \
              -H site/head.html -B site/topbar.html \
              --css style.css --standalone -o "$out"
          done
          # ---------- index ----------
          {
            echo '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>syllabus-to-papers</title><link rel="stylesheet" href="style.css">'
            cat site/head.html
            echo '</head><body>'
            cat site/topbar-index.html
            echo '<h1>📚 Papers</h1><ul>'
            find site -name "*.html" ! -name "index.html" ! -name "header.html" ! -name "topbar.html" ! -name "topbar-index.html" ! -name "head.html" | sort | while read f; do
              p="${f#site/}"; n="${p%.html}"; echo "<li><a href='$p'>${n//\//› }</a></li>"
            done
            echo '</ul></body></html>'
          } > site/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

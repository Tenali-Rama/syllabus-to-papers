name: pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Build HTML site
        run: |
          mkdir -p site
                    cat > site/style.css <<'CSS'
          :root{--bg:#ffffff;--fg:#1a1a1a;--muted:#666;--border:#ccc;--accent:#0a66d0;--code-bg:#f2f2f2;--box:#eef}
          @media (prefers-color-scheme: dark){:root{--bg:#121212;--fg:#e6e6e6;--muted:#9a9a9a;--border:#444;--accent:#6db2ff;--code-bg:#1e1e1e;--box:#1a2233}}
          body.dark{--bg:#121212;--fg:#e6e6e6;--muted:#9a9a9a;--border:#444;--accent:#6db2ff;--code-bg:#1e1e1e;--box:#1a2233}
          body{font-family:Georgia,serif;max-width:860px;margin:0 auto;padding:0 1.2rem 3rem;line-height:1.65;color:var(--fg);background:var(--bg)}
          .topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);margin-bottom:1.5rem}
          .topbar a{color:var(--accent);text-decoration:none;font-weight:bold}
          #themeBtn{background:var(--code-bg);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:0.9rem}
          h1{border-bottom:2px solid var(--border);padding-bottom:6px} h2{border-bottom:1px solid var(--border);margin-top:2.2rem}
          h3{margin-top:1.5rem}
          table{border-collapse:collapse;margin:1rem 0} th,td{border:1px solid var(--border);padding:6px 12px;text-align:left}
          th{background:var(--code-bg)}
          details{margin:0.6rem 0;border:1px solid var(--border);border-radius:6px;padding:6px 12px}
          summary{cursor:pointer;font-weight:bold}
          code{background:var(--code-bg);padding:1px 4px;border-radius:3px}
          hr{border:none;border-top:1px solid var(--border);margin:2rem 0}
          strong{color:var(--fg)} em{color:var(--fg)}
          .katex{font-size:1.05em}
          @media print{.topbar,#themeBtn{display:none}body{max-width:none}}
          CSS
                    cat > site/header.html <<'H'
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
          <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
          <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
            onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true},{left:'$',right:'$',display:false}],throwOnError:false});"></script>
          <div class="topbar"><a href="../index.html">← All papers</a><button id="themeBtn" onclick="toggleTheme()">🌙</button></div>
          <script>
          function toggleTheme(){document.body.classList.toggle('dark');
           const d=document.body.classList.contains('dark');localStorage.setItem('theme',d?'dark':'light');
           document.getElementById('themeBtn').textContent=d?'☀️':'🌙';}
          if(localStorage.getItem('theme')==='dark')document.addEventListener('DOMContentLoaded',()=>{document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️'});
          </script>
          H
          find papers -name "*.md" ! -name "qa_report.md" ! -name "blueprint.md" | while read f; do
            out="site/${f#papers/}"
            mkdir -p "$(dirname "$out")"
            out="${out%.md}.html"
            pandoc "$f" -f gfm -t html --mathjax -c style.css -H site/header.html -s -o "$out" --metadata title="$(basename "$out" .html)"
          done
          {
            echo '<html><head><title>syllabus-to-papers</title><link rel="stylesheet" href="style.css"></head><body><div class="topbar"><span></span></div>'
            echo '<h1>📚 Papers</h1><ul>'
            find site -name "*.html" ! -name index.html ! -name header.html | sort | while read f; do
              p="${f#site/}"; echo "<li><a href='$p'>$p</a></li>"
            done
            echo '</ul></body></html>'
          } > site/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
